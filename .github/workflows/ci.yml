name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Bağımlılıkları kur
        run: pip install Pillow piexif mutagen -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest -q
