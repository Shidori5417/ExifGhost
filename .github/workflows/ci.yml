name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sistem paketleri (ffmpeg, jpegtran, Tk, Xvfb)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libjpeg-turbo-progs python3-tk xvfb
      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: pytest
        run: xvfb-run -a pytest -q -rs
